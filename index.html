<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Meridian Theatre Ticketing</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <h1>Grand Meridian Theatre</h1>
        <p class="tagline">Select your seats</p>
    </header>

    <main class="layout">
        <section class="map-panel" aria-labelledby="map-title">
            <h2 id="map-title">Venue Map</h2>

            <div class="map-controls" role="group" aria-label="Map navigation">
                <button type="button" data-action="zoom-in" aria-label="Zoom in">+</button>
                <button type="button" data-action="zoom-out" aria-label="Zoom out">&minus;</button>
                <button type="button" data-action="move-up" aria-label="Move up">&uarr;</button>
                <button type="button" data-action="move-down" aria-label="Move down">&darr;</button>
                <button type="button" data-action="move-left" aria-label="Move left">&larr;</button>
                <button type="button" data-action="move-right" aria-label="Move right">&rarr;</button>
                <button type="button" data-action="reset" aria-label="Reset and center view">Reset</button>
            </div>

            <div class="map-viewport" id="map-viewport">
                <div class="map-canvas" id="map-canvas">
                    <div class="stage" id="stage">STAGE</div>
                    <!--JavaScript functionality will be addded here-->
                </div>
            </div>

            <ul class="legend" id="legend" aria-label="Legend"></ul>
        </section>

        <aside class="sidebar">
            <section class="panel" aria-labelledby="details-title">
                <h2 id="details-title">Seat Details</h2>
                <div id="seat-details" class="seat-details">
                    <p class="muted">Click a seat on the map to inspect it</p>
                </div>
                <button type="button" id="add-to-cart" class="primary" disabled>ADD TO CART</button>
            </section>
            <section class="panel" aria-labelledby="cart-title">
                <h2 id="cart-title">Your cart</h2>
                <ul id="cart-list" class="cart-list">
                    <li class="muted">Your cart is empty.</li>
                </ul>
                <p class="cart-total">Total: <strong id="cart-total">$0</strong></p>
            </section>
 
            <section class="panel" aria-labelledby="prices-title">
                <h2 id="prices-title">Ticket prices</h2>
                <ul id="price-list" class="price-list"></ul>
            </section>
        </aside>
    </main>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    
</body>
</html>
